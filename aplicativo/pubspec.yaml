name: equilog
description: "EquiLog: registro integrado de equinos atletas"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  sqflite: ^2.4.4+1
  path: ^1.9.1
  uuid: ^4.6.0
  connectivity_plus: ^7.3.2
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true

  # Certificado autoassinado do servico de desenvolvimento, copiado de
  # servico/certs/servidor.crt (nao versionado; ver README)
  assets:
    - assets/certificados/
