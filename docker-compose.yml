name: equilog

services:
  banco:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${PORTA_BANCO:-5432}:5432"
    volumes:
      - dados-banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  servico:
    build: ./servico
    restart: unless-stopped
    depends_on:
      banco:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@banco:5432/${POSTGRES_DB}?schema=public
      PORTA_HTTPS: 3443
      PORTA_HTTP: 3080
    ports:
      - "${PORTA_HTTPS:-3443}:3443"
      - "${PORTA_HTTP:-3080}:3080"
    volumes:
      - ./servico/certs:/app/certs

volumes:
  dados-banco:
